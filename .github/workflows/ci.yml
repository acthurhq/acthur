name: Acthur CI

on:
  push:
    branches: [main, staging, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  # ── Lint + Vet ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: latest

  # ── Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.23"]
        # macos-15-intel (Intel/x86_64), not macos-latest (Apple Silicon/arm64):
        # `go test -race` on arm64 macos-latest runners aborts immediately
        # with "dyld: missing LC_UUID load command" — a known incompatibility
        # between the stock (non-ad-hoc-signed) race-detector binary Go
        # produces and arm64 macOS's dyld/TSAN signing requirements on
        # GitHub's arm64 runner image. x86_64 runners don't hit this signing
        # path, so pin GitHub's current Intel image until upstream
        # Go/runner-image ships a fix.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Run tests
        run: go test ./... -race -count=1 -coverprofile=coverage.out
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest' && matrix.go == '1.22'
        with:
          name: coverage
          path: coverage.out

  # ── Build snapshot ─────────────────────────────────────────────────────────
  build:
    name: Build snapshot
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build snapshot binaries
        run: make build-all
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  installer:
    name: Installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Verify Unix installer integrity
        if: runner.os != 'Windows'
        run: sh scripts/install_test.sh
      - name: Verify Windows installer integrity
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_test.ps1

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    needs: [lint, test, installer]
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=sign

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [lint, test, installer]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0
        with:
          cosign-release: v3.0.6
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attest release provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*checksums.txt
            dist/*.spdx.json
      - name: Publish attested release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
