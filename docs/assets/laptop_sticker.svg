<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Glowing Effect Filter -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1b233d" />
    </linearGradient>

    <linearGradient id="accent-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.3" />
    </linearGradient>

    <!-- Carbon Hex Pattern for Background -->
    <pattern id="hex-grid" width="20" height="34.64" patternUnits="userSpaceOnUse" patternTransform="scale(1)">
      <path d="M 10 0 L 20 5.77 L 20 17.32 L 10 23.09 L 0 17.32 L 0 5.77 Z" fill="none" stroke="#232d4b" stroke-width="0.8" opacity="0.6"/>
      <path d="M 10 34.64 L 20 40.41 L 20 51.96 L 10 57.73 L 0 51.96 L 0 40.41 Z" fill="none" stroke="#232d4b" stroke-width="0.8" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base (Hexagon Shape) -->
  <!-- Pointy-topped Hexagon path -->
  <path d="M 250 15 L 453 132.5 L 453 367.5 L 250 485 L 47 367.5 L 47 132.5 Z" fill="url(#bg-grad)" stroke="#161b2c" stroke-width="4" />
  
  <!-- Hex Grid Overlay -->
  <path d="M 250 15 L 453 132.5 L 453 367.5 L 250 485 L 47 367.5 L 47 132.5 Z" fill="url(#hex-grid)" />

  <!-- Outer Neon Border -->
  <path d="M 250 20 L 448 135 L 448 365 L 250 480 L 52 365 L 52 135 Z" fill="none" stroke="url(#cyber-grad)" stroke-width="6" filter="url(#neon-glow)" />
  <path d="M 250 20 L 448 135 L 448 365 L 250 480 L 52 365 L 52 135 Z" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />

  <!-- Inner Concentric Hexagon for Cyberpunk HUD Vibe -->
  <path d="M 250 35 L 435 142 L 435 358 L 250 465 L 65 358 L 65 142 Z" fill="none" stroke="#232d4b" stroke-width="2" />
  <path d="M 250 40 L 430 145 L 430 355 L 250 460 L 70 355 L 70 145 Z" fill="none" stroke="url(#cyber-grad)" stroke-width="1" stroke-dasharray="10 15" opacity="0.6" />

  <!-- LOGO GRAPH (Abstract Geometric "A" representing DAG) -->
  <g transform="translate(0, -25)">
    <!-- Edges (Paths) -->
    <path d="M 250 150 L 170 310" stroke="url(#cyber-grad)" stroke-width="5" opacity="0.8" />
    <path d="M 250 150 L 330 310" stroke="url(#cyber-grad)" stroke-width="5" opacity="0.8" />
    <path d="M 170 310 L 330 310" stroke="url(#cyber-grad)" stroke-width="5" opacity="0.8" />
    
    <!-- Crossbar Inner Node connections -->
    <path d="M 210 230 L 290 230" stroke="#00f2fe" stroke-width="4" filter="url(#subtle-glow)" />
    <path d="M 250 150 L 250 210" stroke="#7000ff" stroke-width="4" />
    <path d="M 250 210 L 210 230" stroke="#00f2fe" stroke-width="3" />
    <path d="M 250 210 L 290 230" stroke="#7000ff" stroke-width="3" />
    <path d="M 210 230 L 250 310" stroke="#00f2fe" stroke-width="3" />
    <path d="M 290 230 L 250 310" stroke="#7000ff" stroke-width="3" />
    
    <!-- Glow behind lines -->
    <path d="M 250 150 L 170 310 M 250 150 L 330 310 M 170 310 L 330 310" stroke="url(#cyber-grad)" stroke-width="8" opacity="0.3" filter="url(#neon-glow)" />

    <!-- Nodes (Circles) -->
    <!-- Top Node (Ring 0) -->
    <circle cx="250" cy="150" r="16" fill="#0b0f19" stroke="#00f2fe" stroke-width="5" filter="url(#neon-glow)" />
    <circle cx="250" cy="150" r="6" fill="#ffffff" />
    
    <!-- Left Bottom Node -->
    <circle cx="170" cy="310" r="14" fill="#0b0f19" stroke="#7000ff" stroke-width="4" filter="url(#subtle-glow)" />
    <circle cx="170" cy="310" r="5" fill="#7000ff" />
    
    <!-- Right Bottom Node -->
    <circle cx="330" cy="310" r="14" fill="#0b0f19" stroke="#7000ff" stroke-width="4" filter="url(#subtle-glow)" />
    <circle cx="330" cy="310" r="5" fill="#7000ff" />

    <!-- Center Hub Node -->
    <circle cx="250" cy="210" r="10" fill="#0b0f19" stroke="#00f2fe" stroke-width="3" />
    <circle cx="250" cy="210" r="4" fill="#00f2fe" />

    <!-- Inner Mid-Left Node -->
    <circle cx="210" cy="230" r="10" fill="#0b0f19" stroke="#00f2fe" stroke-width="3" />
    <circle cx="210" cy="230" r="4" fill="#00f2fe" />

    <!-- Inner Mid-Right Node -->
    <circle cx="290" cy="230" r="10" fill="#0b0f19" stroke="#7000ff" stroke-width="3" />
    <circle cx="290" cy="230" r="4" fill="#7000ff" />

    <!-- Central Base Node -->
    <circle cx="250" cy="310" r="12" fill="#0b0f19" stroke="#00f2fe" stroke-width="4" filter="url(#subtle-glow)" />
    <circle cx="250" cy="310" r="5" fill="#00f2fe" />
  </g>

  <!-- Typography -->
  <!-- Brand Wordmark -->
  <text x="250" y="375" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#ffffff" letter-spacing="6" filter="url(#subtle-glow)">ACTHUR</text>
  
  <!-- Tagline / Subtitle -->
  <text x="250" y="405" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#00f2fe" letter-spacing="4">RING 0 KERNEL</text>
  <text x="250" y="425" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="10" fill="#a0aec0" letter-spacing="2">RUNTIME GRAPH OS</text>

  <!-- Cybernetic tech corner accents -->
  <path d="M 120 443 L 140 453" stroke="url(#cyber-grad)" stroke-width="2" opacity="0.6"/>
  <path d="M 380 443 L 360 453" stroke="url(#cyber-grad)" stroke-width="2" opacity="0.6"/>
</svg>
