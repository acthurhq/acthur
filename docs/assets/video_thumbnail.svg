<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <!-- Glow Filters -->
    <filter id="glow-heavy" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-medium" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0e142a" />
      <stop offset="100%" stop-color="#1b254a" />
    </linearGradient>

    <linearGradient id="cyan-violet-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#7000ff" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Cyber Isometric Grid Pattern -->
    <pattern id="iso-grid" width="60" height="104" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 34.64 L 0 69.28 L 60 104 L 120 69.28 L 120 34.64 Z" fill="none" stroke="#1d2a45" stroke-width="0.8" />
      <circle cx="60" cy="52" r="1" fill="#00f2fe" opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg-grad)" />
  <rect width="1280" height="720" fill="url(#iso-grid)" opacity="0.8" />

  <!-- Diagonal Abstract Cyber Glow Block behind graphics -->
  <polygon points="700,0 1280,0 1280,720 500,720" fill="url(#cyan-violet-grad)" opacity="0.12" filter="url(#glow-heavy)" />

  <!-- LEFT SIDE: Text Content (High Contrast & Scale) -->
  <g transform="translate(100, 180)">
    
    <!-- Top Small Tech Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="18" r="5" fill="#00f2fe" filter="url(#glow-medium)" />
      <text x="36" y="23" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="12" fill="#00f2fe" letter-spacing="2">DEV-DEEP-DIVE</text>
    </g>

    <!-- Main Title Lines -->
    <text x="0" y="115" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="94" fill="#ffffff" letter-spacing="-1">WHAT IS A</text>
    <text x="0" y="215" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="104" fill="url(#cyan-violet-grad)" letter-spacing="1" filter="url(#glow-medium)">GRAPH OS?</text>
    
    <!-- Sub-heading/Tagline -->
    <text x="0" y="295" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="28" fill="#e2e8f0" letter-spacing="2">Acthur: Backend Runtime OS</text>

    <!-- Action Callout / Feature Badges -->
    <g transform="translate(0, 340)">
      <!-- Badge 1: Rust/Go Performance -->
      <rect x="0" y="0" width="160" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#00f2fe" stroke-width="1" />
      <text x="80" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">GO / GRAPHS</text>
      
      <!-- Badge 2: Architecture -->
      <rect x="180" y="0" width="160" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#7000ff" stroke-width="1" />
      <text x="260" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#ffffff">RING KERNEL</text>

      <!-- Badge 3: Scale -->
      <rect x="360" y="0" width="160" height="42" rx="6" fill="#0f172a" fill-opacity="0.9" stroke="#f6d365" stroke-width="1" />
      <text x="440" y="26" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13" fill="#f6d365">100% PRODUCTION</text>
    </g>
  </g>

  <!-- RIGHT SIDE: Glowing 3D Node Graph / Network Cube Graphics -->
  <g transform="translate(850, 360)">
    
    <!-- Outer Glow Aura -->
    <circle cx="0" cy="0" r="180" fill="url(#cyan-violet-grad)" opacity="0.05" filter="url(#glow-heavy)" />

    <!-- Isometric Graph Edges (3D box shape) -->
    <!-- Front Face -->
    <line x1="-120" y1="-70" x2="0" y2="-140" stroke="#00f2fe" stroke-width="4" filter="url(#glow-medium)" />
    <line x1="0" y1="-140" x2="120" y2="-70" stroke="#7000ff" stroke-width="4" />
    <line x1="120" y1="-70" x2="120" y2="70" stroke="#00f2fe" stroke-width="4" />
    <line x1="120" y1="70" x2="0" y2="140" stroke="#7000ff" stroke-width="4" />
    <line x1="0" y1="140" x2="-120" y2="70" stroke="#00f2fe" stroke-width="4" />
    <line x1="-120" y1="70" x2="-120" y2="-70" stroke="#7000ff" stroke-width="4" />

    <!-- Center Hub Edges -->
    <line x1="0" y1="-140" x2="0" y2="20" stroke="#ffffff" stroke-width="3" opacity="0.6" stroke-dasharray="4 4" />
    <line x1="-120" y1="70" x2="0" y2="20" stroke="#00f2fe" stroke-width="3" />
    <line x1="120" y1="70" x2="0" y2="20" stroke="#7000ff" stroke-width="3" />
    <line x1="-120" y1="-70" x2="0" y2="20" stroke="#00f2fe" stroke-width="3" />
    <line x1="120" y1="-70" x2="0" y2="20" stroke="#7000ff" stroke-width="3" />
    <line x1="0" y1="140" x2="0" y2="20" stroke="#ffffff" stroke-width="3" />

    <!-- Nodes (Circles) -->
    <!-- Top Central Node -->
    <circle cx="0" cy="-140" r="16" fill="#050814" stroke="#00f2fe" stroke-width="5" filter="url(#glow-medium)" />
    <circle cx="0" cy="-140" r="6" fill="#ffffff" />

    <!-- Bottom Central Node -->
    <circle cx="0" cy="140" r="16" fill="#050814" stroke="#7000ff" stroke-width="5" filter="url(#glow-medium)" />
    <circle cx="0" cy="140" r="6" fill="#ffffff" />

    <!-- Left Top Node -->
    <circle cx="-120" cy="-70" r="12" fill="#050814" stroke="#00f2fe" stroke-width="4" />
    <circle cx="-120" cy="-70" r="4" fill="#00f2fe" />

    <!-- Left Bottom Node -->
    <circle cx="-120" cy="70" r="12" fill="#050814" stroke="#00f2fe" stroke-width="4" />
    <circle cx="-120" cy="70" r="4" fill="#00f2fe" />

    <!-- Right Top Node -->
    <circle cx="120" cy="-70" r="12" fill="#050814" stroke="#7000ff" stroke-width="4" />
    <circle cx="120" cy="-70" r="4" fill="#7000ff" />

    <!-- Right Bottom Node -->
    <circle cx="120" cy="70" r="12" fill="#050814" stroke="#7000ff" stroke-width="4" />
    <circle cx="120" cy="70" r="4" fill="#7000ff" />

    <!-- Center Focal Node -->
    <circle cx="0" cy="20" r="22" fill="#0e142a" stroke="url(#gold-grad)" stroke-width="6" filter="url(#glow-heavy)" />
    <circle cx="0" cy="20" r="8" fill="#ffffff" />
  </g>

  <!-- Graphic Tech Details Around Cube -->
  <g transform="translate(850, 360)" font-family="monospace" font-size="10" fill="#a0aec0" opacity="0.7">
    <text x="140" y="-140" text-anchor="start">SCHEDULER: Kahn_Topo_Sort</text>
    <text x="140" y="-125" text-anchor="start">NODES: 124 // EDGES: 489</text>
    <text x="-140" y="140" text-anchor="end">SYS_THREAD: 14 ACTIVE</text>
    <text x="-140" y="155" text-anchor="end">BLAST_RADIUS: 0% SAFE</text>
  </g>

  <!-- Red Recording indicator in top-right -->
  <g transform="translate(1180, 50)">
    <circle cx="0" cy="0" r="8" fill="#ff3b30" filter="url(#glow-medium)" />
    <text x="-18" y="5" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ff3b30" text-anchor="end">REC</text>
  </g>
</svg>
