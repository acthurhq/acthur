openapi: "3.0.3"
info:
  title: users
  version: "1"
paths:
  /api/v1/users:
    post:
      operationId: create_user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  maxLength: 100
                email:
                  type: string
                  format: email
                role:
                  type: string
                  enum: [admin, member, viewer]
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        "409":
          description: email already taken
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    enum: [email_taken]
    get:
      operationId: list_users
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  total:
                    type: integer
components:
  schemas:
    User:
      type: object
      required: [id, name, email, created_at]
      properties:
        id:
          type: string
          format: uuid
          x-acthur-type: ulid
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
