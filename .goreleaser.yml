# .goreleaser.yml
# Multi-platform binary builds for Acthur
# Run: goreleaser release --snapshot --clean (local test)
# Run: goreleaser release (on tagged commit via CI)

version: 2

project_name: acthur

before:
  hooks:
    - go mod tidy

builds:
  - id: acthur
    main: ./cmd/acthur
    binary: acthur
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    name_template: "acthur_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE.md

checksum:
  name_template: "acthur_{{ .Version }}_checksums.txt"
  algorithm: sha256

# Publish an SPDX SBOM beside every release archive. The release workflow
# installs Syft explicitly; a missing cataloger therefore fails the release.
sboms:
  - id: archives
    artifacts: archive
    documents:
      - "{{ .ArtifactName }}.spdx.json"

# Keyless Sigstore signing binds the checksum manifest to the GitHub Actions
# workflow identity and records the signature in Rekor. Consumers verify the
# bundle, then use the signed manifest to verify every archive and SBOM.
signs:
  - id: checksums
    cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - --yes
    artifacts: checksum

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: acthurhq
    name: acthur
  # Artifacts remain private until the workflow has attested them successfully.
  draft: true
  prerelease: auto
  name_template: "Acthur v{{.Version}}"

# Homebrew and Scoop are intentionally deferred until acthurhq/homebrew-tap
# and acthurhq/scoop-bucket exist and have dedicated publish credentials.
