# .goreleaser.yml
# Multi-platform binary builds for Acthur
# Run: goreleaser release --snapshot --clean (local test)
# Run: goreleaser release (on tagged commit via CI)

version: 2

project_name: acthur

before:
  hooks:
    - go mod tidy

builds:
  - id: acthur
    main: ./cmd/acthur
    binary: acthur
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/acthur/acthur/cmd/acthur.Version={{.Version}}
    flags:
      - -trimpath

archives:
  - id: default
    name_template: "acthur_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "acthur_{{ .Version }}_checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: acthur
    name: acthur
  draft: false
  prerelease: auto
  name_template: "Acthur v{{.Version}}"

brews:
  - name: acthur
    homepage: https://acthur.dev
    description: Runtime Graph Operating System with Pluggable Infrastructure Nodes
    repository:
      owner: acthur
      name: homebrew-tap
    install: |
      bin.install "acthur"
    test: |
      system "#{bin}/acthur", "version"

scoops:
  - name: acthur
    homepage: https://acthur.dev
    description: Runtime Graph Operating System with Pluggable Infrastructure Nodes
    repository:
      owner: acthur
      name: scoop-bucket
    license: MIT
